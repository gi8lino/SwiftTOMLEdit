---
name: Autorelease
on:
  pull_request_target:
    types: [closed]

permissions:
  contents: read
  actions: write

concurrency:
  group: autorelease-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  dispatch-release:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == github.event.repository.default_branch &&
      (contains(github.event.pull_request.labels.*.name, 'bump:patch') ||
       contains(github.event.pull_request.labels.*.name, 'bump:minor') ||
       contains(github.event.pull_request.labels.*.name, 'bump:major'))
    runs-on: ubuntu-latest
    steps:
      # Metadata only: never check out or execute pull-request code here.
      - name: Dispatch pipeline-owned release
        env:
          GH_TOKEN: ${{ github.token }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          SOURCE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail
          current=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          version=$(CURRENT="$current" python3 - <<'PYTHON'
          import json, os, re
          current = os.environ["CURRENT"]
          if not re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", current):
              raise SystemExit("Latest release must be a stable semantic version")
          major, minor, patch = map(int, current[1:].split("."))
          labels = json.loads(os.environ["LABELS"])
          if "bump:major" in labels:
              major, minor, patch = major + 1, 0, 0
          elif "bump:minor" in labels:
              minor, patch = minor + 1, 0
          else:
              patch += 1
          print(f"{major}.{minor}.{patch}")
          PYTHON
          )
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref main \
            --field version="$version" --field source_sha="$SOURCE_SHA"
