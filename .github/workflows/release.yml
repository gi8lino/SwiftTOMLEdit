name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26

    env:
      XCODE_VERSION: "26"

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .build/native-toml/rust-target
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Rust/SwiftTOMLEdit/Cargo.lock') }}
          restore-keys: |
            rust-${{ runner.os }}-${{ runner.arch }}-

      - name: Regenerate and test
        run: make verify

      - name: Verify committed XCFramework
        shell: bash
        run: |
          test -f Artifacts/CSwiftTOMLEdit.xcframework/Info.plist
          status="$(git status --porcelain --untracked-files=all -- Rust/SwiftTOMLEdit/Cargo.lock Artifacts/CSwiftTOMLEdit.xcframework)"
          if [ -n "$status" ]; then
            echo "$status"
            echo "Cargo.lock or the committed XCFramework is missing or stale." >&2
            exit 1
          fi

      - name: Package release artifact
        shell: bash
        run: |
          make package
          shasum -a 256 dist/CSwiftTOMLEdit.xcframework.zip > dist/SHA256SUMS.txt
          swift package compute-checksum dist/CSwiftTOMLEdit.xcframework.zip \
            > dist/SWIFTPM_CHECKSUM.txt

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          assets=(
            dist/CSwiftTOMLEdit.xcframework.zip
            dist/SHA256SUMS.txt
            dist/SWIFTPM_CHECKSUM.txt
          )
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${assets[@]}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "${assets[@]}" --generate-notes
          fi
