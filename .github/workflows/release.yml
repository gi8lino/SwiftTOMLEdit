name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (for example 0.2.3); must not exist yet
        required: true
        type: string
      source_sha:
        description: Exact main commit to release (defaults to this workflow commit)
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26

    env:
      XCODE_VERSION: "26"

    steps:
      - name: Validate release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
          REQUESTED_SOURCE: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          tag="v${REQUESTED_VERSION#v}"
          source_sha="${REQUESTED_SOURCE:-$GITHUB_SHA}"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          [[ "$source_sha" =~ ^[a-f0-9]{40}$ ]]
          current=$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq .commit.sha)
          [[ "$source_sha" == "$current" ]]
          refs=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$tag" --jq '.[].ref')
          if grep -Fxq "refs/tags/$tag" <<< "$refs"; then
            echo "Release tag already exists: $tag" >&2
            exit 1
          fi
          releases=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq '.[].tag_name')
          if grep -Fxq "$tag" <<< "$releases"; then
            echo "Release already exists: $tag" >&2
            exit 1
          fi
          printf 'tag=%s\nsource=%s\n' "$tag" "$source_sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.release.outputs.source }}
          fetch-depth: 0

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .build/native-toml/rust-target
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Rust/SwiftTOMLEdit/Cargo.lock') }}
          restore-keys: |
            rust-${{ runner.os }}-${{ runner.arch }}-

      - name: Build and test
        run: make verify

      - name: Package release artifact
        id: artifact
        shell: bash
        run: |
          make package
          checksum="$(swift package compute-checksum dist/CSwiftTOMLEdit.xcframework.zip)"
          shasum -a 256 dist/CSwiftTOMLEdit.xcframework.zip > dist/SHA256SUMS.txt
          printf '%s\n' "$checksum" > dist/SWIFTPM_CHECKSUM.txt
          echo "checksum=$checksum" >> "$GITHUB_OUTPUT"

      - name: Create release commit and tag
        id: metadata
        env:
          CHECKSUM: ${{ steps.artifact.outputs.checksum }}
          TAG: ${{ steps.release.outputs.tag }}
          SOURCE_SHA: ${{ steps.release.outputs.source }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          scripts/prepare-release.sh "$TAG" "$CHECKSUM" "$SOURCE_SHA"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          gh release create "$TAG" \
            dist/CSwiftTOMLEdit.xcframework.zip \
            dist/SHA256SUMS.txt \
            dist/SWIFTPM_CHECKSUM.txt \
            --generate-notes \
            --verify-tag \
            --target "${{ steps.metadata.outputs.commit }}"

      - name: Verify published SwiftPM artifact
        run: |
          swift package reset
          swift test
