name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (for example, 0.1.0)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26

    env:
      XCODE_VERSION: "26"

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Run releases from the main branch." >&2
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: $VERSION" >&2
            exit 1
          fi

          tag="v$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Tag already exists: $tag" >&2
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release already exists: $tag" >&2
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .build/native-toml/rust-target
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Rust/SwiftTOMLEdit/Cargo.lock') }}
          restore-keys: |
            rust-${{ runner.os }}-${{ runner.arch }}-

      - name: Build and test
        run: make verify

      - name: Package release artifact
        id: artifact
        shell: bash
        run: |
          make package
          checksum="$(swift package compute-checksum dist/CSwiftTOMLEdit.xcframework.zip)"
          shasum -a 256 dist/CSwiftTOMLEdit.xcframework.zip > dist/SHA256SUMS.txt
          printf '%s\n' "$checksum" > dist/SWIFTPM_CHECKSUM.txt
          echo "checksum=$checksum" >> "$GITHUB_OUTPUT"

      - name: Create release commit and tag
        shell: bash
        env:
          CHECKSUM: ${{ steps.artifact.outputs.checksum }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          sed -i '' -E "s/let releaseTag = \"[^\"]+\"/let releaseTag = \"$TAG\"/" Package.swift
          sed -i '' -E "s/let releaseChecksum = \"[a-f0-9]+\"/let releaseChecksum = \"$CHECKSUM\"/" Package.swift
          swift package dump-package >/dev/null

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Package.swift
          git commit -m "chore: prepare release $TAG"
          git tag -a "$TAG" -m "Release $TAG"
          git push --atomic origin "HEAD:main" "refs/tags/$TAG"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          gh release create "$TAG" \
            dist/CSwiftTOMLEdit.xcframework.zip \
            dist/SHA256SUMS.txt \
            dist/SWIFTPM_CHECKSUM.txt \
            --generate-notes \
            --verify-tag
