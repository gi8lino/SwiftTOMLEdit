name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish (for example, v0.0.2)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26

    env:
      XCODE_VERSION: "26"

    steps:
      - name: Resolve tag
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSHED_TAG: ${{ github.ref_name }}
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            tag="$PUSHED_TAG"
          else
            tag="$REQUESTED_TAG"
          fi

          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ steps.release.outputs.tag }}

      - name: Verify tag exists
        shell: bash
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: git rev-parse --verify "refs/tags/$TAG"

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .build/native-toml/rust-target
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Rust/SwiftTOMLEdit/Cargo.lock') }}
          restore-keys: |
            rust-${{ runner.os }}-${{ runner.arch }}-

      - name: Build and test
        run: make verify

      - name: Package release artifact
        shell: bash
        run: |
          make package
          shasum -a 256 dist/CSwiftTOMLEdit.xcframework.zip > dist/SHA256SUMS.txt
          swift package compute-checksum dist/CSwiftTOMLEdit.xcframework.zip \
            > dist/SWIFTPM_CHECKSUM.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          assets=(
            dist/CSwiftTOMLEdit.xcframework.zip
            dist/SHA256SUMS.txt
            dist/SWIFTPM_CHECKSUM.txt
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            gh release create "$TAG" "${assets[@]}" --generate-notes --verify-tag
          fi
